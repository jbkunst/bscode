url: https://jbkunst.github.io/bscode/

development:
  mode: unreleased
  version_label: warning

template:
  bootstrap: 5
  light-switch: true
  bslib:
    bg: "#F3F3F3"
    fg: "#1E1E1E"
    primary: "#007ACC"
    secondary: "#6A737D"
    navbar-bg: "#007ACC"
    border-color: "#D4D4D4"

navbar:
  type: dark
  structure:
    left: [reference, examples]
    right: [search, lightswitch, github]
  components:
    examples:
      text: Examples
      menu:
        - text: Examples overview
          href: articles/index.html
        - text: "-----"
        - text: Basic navigation
          href: articles/basic-navigation.html
        - text: Flight operations
          href: articles/flight-operations.html
        - text: SQL console
          href: articles/sql-console.html
        - text: Full-screen maps
          href: articles/maps.html
        - text: Themes and icons
          href: articles/themes-and-icons.html
        - text: Sidebar navigation
          href: articles/sidebar-navigation.html

articles:
  - title: Interactive examples
    desc: Run each bscode application directly in the browser with Shinylive.
    contents:
      - starts_with("articles/")

reference:
  - title: Page layout
    desc: VS Code-inspired activity bar and sidebar navigation for bslib applications.
    contents:
      - page_bscode

footer:
  structure:
    left: developed_by
    right: built_with
