# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest

    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      SHINYLIVE_WASM_PACKAGES: "true"

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::pkgdown
            any::quarto
            any::shinylive
            any::bsicons
            any::DBI
            any::fontawesome
            any::leaflet
            any::lucidr
            any::mapgl
            any::phosphoricons
            any::plotly
            any::reactable
            any::RSQLite
            any::tibble
            local::.
          needs: website

      - name: Cache Shinylive assets and packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/shinylive
          key: ${{ runner.os }}-shinylive-${{ hashFiles('DESCRIPTION', 'inst/examples/**/app.R') }}
          restore-keys: |
            ${{ runner.os }}-shinylive-

      - name: Generate example articles
        run: Rscript tools/build-example-articles.R

      - name: Build pkgdown site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE, quiet = FALSE)
        shell: Rscript {0}

      - name: Export standalone Shinylive apps
        run: Rscript tools/export-shinylive-apps.R

      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4.8.0
        with:
          clean: true
          branch: gh-pages
          folder: docs
