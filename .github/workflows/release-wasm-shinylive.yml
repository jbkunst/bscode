name: Build WebAssembly and Shinylive release

on:
  release:
    types: [published]

jobs:
  wasm:
    uses: r-wasm/actions/.github/workflows/release-file-system-image.yml@v1
    with:
      strip: "demo, doc, examples, help, html, include, tests, vignette"
    permissions:
      contents: write
      repository-projects: read

  shinylive:
    name: Export Shinylive example
    needs: wasm
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install export dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::pak
            cran::shinylive

      - name: Install released bscode package
        shell: Rscript {0}
        run: |
          ref <- Sys.getenv("GITHUB_REF_NAME")
          pak::pak(sprintf("jbkunst/bscode@%s", ref))

      - name: Export basic example with Shinylive
        shell: Rscript {0}
        run: |
          shinylive::export(
            appdir = "inst/examples/01-basic",
            destdir = "_site",
            subdir = "basic",
            wasm_packages = TRUE,
            template_params = list(title = "bscode · Basic example")
          )

          index <- file.path("_site", "basic", "index.html")
          if (!file.exists(index)) {
            stop("Shinylive export completed without creating index.html.")
          }

      - name: Upload Shinylive site artifact
        uses: actions/upload-artifact@v4
        with:
          name: bscode-shinylive-${{ github.event.release.tag_name }}
          path: _site
          if-no-files-found: error
          retention-days: 30
